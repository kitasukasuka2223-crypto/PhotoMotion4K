
name: Build PhotoMotion4K APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract PhotoMotion4K source
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'PhotoMotion4K-POCO-F6-CloudBuild*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "CloudBuild ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle --no-daemon -p source/PhotoMotion4K-v0.3.1 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMotion4K-APK
          path: source/PhotoMotion4K-v0.3.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

